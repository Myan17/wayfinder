[project]
name = "wayfinder-api"
version = "0.0.1"
description = "Permission-aware retrieval and question answering over a GitHub organization (read path)"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "jsonschema[format-nongpl]>=4.23",  # eval-data: validates the S1 pairs file (#56)
  "ruff>=0.7",
  "psycopg[binary]>=3.2",   # spike S3 and, per DESIGN 12, the driver the API will use
]
s2 = [
    "onnxruntime==1.31.0",  # S2 reference reranker (ADR-0019); released two weeks or more before pinning
    "tokenizers==0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/wayfinder"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "scripts/tests", "infra/manifest/tests", "eval/miners/tests", "eval/harness/tests"]
pythonpath = ["apps/api", "eval/miners", "eval/harness"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "s2_scale: S2's exact 60,000-row build test; runs in the s2 job (make s2-scale-test), not in db-test",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
