[project]
name = "wayfinder-api"
version = "0.0.1"
description = "Permission-aware retrieval and question answering over a GitHub organization (read path)"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/wayfinder"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "scripts/tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
